name: Build and Publish OpenWrt Feed (APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Build and publish one target or all targets
        required: true
        default: all
        type: choice
        options:
          - all
          - openwrt-filogic
          - openwrt-x86-64
          - immortalwrt-airoha-an7581

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      feed: ${{ steps.filter.outputs.feed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            feed:
              - '.github/workflows/feed.yml'
              - '.ci/**'
              - 'scripts/**'
              - 'packages/**'
              - 'luci/**'
              - 'feeds/**'
              - 'keys/**'
              - 'Makefile'
              - 'README.md'

  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read targets matrix
        id: read
        env:
          SELECTED_TARGET: ${{ github.event.inputs.target }}
        run: |
          selected_target="$SELECTED_TARGET"
          if [ -n "$selected_target" ] && [ "$selected_target" != "all" ]; then
            targets="$(jq -c --arg id "$selected_target" '[.targets[] | select(.id == $id)]' .ci/targets.json)"
          else
            targets="$(jq -c '.targets' .ci/targets.json)"
          fi
          [ "$(jq 'length' <<<"$targets")" -gt 0 ] || {
            echo "No configured target matched: $selected_target" >&2
            exit 1
          }
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [changes, matrix]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.feed == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk make curl zstd tar sed grep findutils \
            build-essential clang flex bison g++ gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget patch perl ccache pkg-config \
            libelf-dev liblz4-tool lz4 xsltproc qemu-utils jq

      - name: Build whitelist packages
        run: |
          mkdir -p "artifacts/${{ matrix.target.id }}"
          chmod +x scripts/build_sdk_packages.sh
          scripts/build_sdk_packages.sh \
            --sdk-url "${{ matrix.target.sdk_url }}" \
            --sdk-sha256 "${{ matrix.target.sdk_sha256 }}" \
            --sdk-dir-glob "${{ matrix.target.sdk_dir_glob }}" \
            --repo-dir "$PWD" \
            --whitelist ".ci/package-whitelist.txt" \
            --artifact-whitelist ".ci/artifact-whitelist.txt" \
            --output-dir "artifacts/${{ matrix.target.id }}"

      - name: Upload per-target APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.id }}
          path: artifacts/${{ matrix.target.id }}
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish/artifacts

      - name: Seed site from the published feed
        run: |
          mkdir -p publish/site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C publish/site
          else
            rc=$?
            [ "$rc" -eq 2 ] || exit "$rc"
          fi

      - name: Normalize artifact directory
        env:
          SELECTED_TARGET: ${{ github.event.inputs.target }}
        run: |
          mkdir -p publish/by-target
          for d in publish/artifacts/apk-*; do
            [ -d "$d" ] || continue
            target_id="${d##*/apk-}"
            mkdir -p "publish/by-target/$target_id"
            cp -f "$d"/*.apk "publish/by-target/$target_id/" || true
          done
          selected_target="$SELECTED_TARGET"
          if [ -n "$selected_target" ] && [ "$selected_target" != "all" ]; then
            jq --arg id "$selected_target" \
              '{targets: [.targets[] | select(.id == $id)]}' \
              .ci/targets.json > publish/targets.json
          else
            cp .ci/targets.json publish/targets.json
          fi
          find publish -maxdepth 4 -type f | sort

      - name: Build feed indexes and signatures
        env:
          APK_SIGN_PRIVATE_KEY_B64: ${{ secrets.APK_SIGN_PRIVATE_KEY_B64 }}
          APK_SIGN_PUBLIC_KEY: ${{ secrets.APK_SIGN_PUBLIC_KEY }}
        run: |
          chmod +x scripts/publish_feed.sh
          scripts/publish_feed.sh \
            --artifacts-dir "publish/by-target" \
            --site-dir "publish/site" \
            --targets-file "publish/targets.json" \
            --key-name "custom-feed.pub"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish/site
          keep_files: true
